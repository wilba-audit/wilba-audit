<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>GTA Decoded</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-body); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--pink); } .deep { fill:var(--purple-deep); } .accent { fill:var(--purple); } .raised { fill:var(--surface-raised); }
  .blk { rx:var(--radius-md); }
  .key { fill:var(--ink); rx:var(--radius-md); }
  .key.on { fill:var(--pink); }
  .key.cut { fill:var(--surface); }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-weight:400; font-size:104px; line-height:.95; letter-spacing:.01em; color:var(--ink); }
  .tag { margin:var(--space-2) 0 0 2px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style></head>
<body><div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      pink 144x240 bled off the top (brand, largest) · purple-deep 240x216 bleeding off the right (the night) · purple 96x96 (accent) · surface-raised 96x48 (relief) — about 30% of 960x288
  arrangement one tall pink slab with a deep night slab beside it, satellites below; bottoms on one line space-6 above the edge, space-4 gutters
  pattern     the D-pad from the logo ("four arrow keys; the up key is pink"): 32px keys at a space-12 pitch in plus shapes, the up key pink, one plus cut into the pink slab in surface
  scales      sides in space-4 multiples; gutters space-4; pitch space-12 (48); corners radius-md
-->
<rect class="brand blk" x="16" y="-16" width="144" height="256" rx="12"/>
<rect class="deep blk" x="176" y="24" width="320" height="240" rx="12"/>
<rect class="accent blk" x="176" y="-40" width="96" height="48" rx="12"/>
<rect class="raised blk" x="288" y="-40" width="96" height="48" rx="12"/>
<!-- D-pad on the night slab -->
<rect class="key on" x="304" y="56" width="32" height="32" rx="12"/>
<rect class="key" x="256" y="104" width="32" height="32" rx="12"/>
<rect class="key" x="352" y="104" width="32" height="32" rx="12"/>
<rect class="key" x="304" y="152" width="32" height="32" rx="12"/>
<!-- second, smaller-scale echo -->
<rect class="key on" x="416" y="152" width="32" height="32" rx="12"/>
<rect class="key" x="368" y="200" width="32" height="32" rx="12"/>
<rect class="key" x="464" y="200" width="32" height="32" rx="12"/>
<!-- D-pad cut into the pink slab -->
<rect class="key cut" x="72" y="88" width="32" height="32" rx="12"/>
<rect class="key cut" x="24" y="136" width="32" height="32" rx="12"/>
<rect class="key cut" x="120" y="136" width="32" height="32" rx="12"/>
<rect class="key cut" x="72" y="184" width="32" height="32" rx="12"/>
</svg></div>
<div class="words"><h1 class="name">GTA<br>Decoded</h1><p class="tag">No-BS GTA 6 codes and guides, tested on camera.</p></div>
</div></body></html>
